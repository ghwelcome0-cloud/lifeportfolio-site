name: Required Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Validate contract activation against base
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CONTRACT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: node scripts/test-contract-manifest.mjs
      - name: Validate legal L0 router against exact source
        env:
          CONTRACT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CONTRACT_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '0' }}
          CONTRACT_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/run-legal-l0-router.mjs
      - name: Validate internal evidence trust root
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          EVIDENCE_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/test-ropa-evidence.mjs
          node scripts/test-legal-authority-registry.mjs
          node scripts/test-internal-evidence-dlp.mjs
          node scripts/verify-internal-evidence-activation.mjs
      - run: npm test
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
          PR_MERGE_SHA: ${{ github.event_name == 'pull_request' && github.sha || '' }}
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_PR_NUMBER: ${{ github.event.pull_request.number || '0' }}
          EVIDENCE_EVENT_NAME: ${{ github.event_name }}
