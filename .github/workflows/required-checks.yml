name: Required Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-checks:
    name: required-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Validate contract activation against base
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          CONTRACT_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: node scripts/test-contract-manifest.mjs
      - run: npm test
