name: Composed Hosting Policy
on:
  pull_request:
    paths:
      - contracts/public-contact-policy*
      - scripts/hosting-artifact-verifier-lib.mjs
      - scripts/test-hosting-artifact-verifier.mjs
permissions:
  contents: read
jobs:
  composed-hosting-policy:
    name: composed-hosting-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - name: Build PR #226 artifact in isolated worktree
        run: |
          git fetch origin pull/226/head:refs/remotes/origin/pr-226
          git worktree add /tmp/pr226 origin/pr-226
          cp contracts/public-contact-policy.json /tmp/pr226/contracts/public-contact-policy.json
          (cd /tmp/pr226 && npm ci && npm run build:hosting)
      - name: Verify composed 259-file artifact with current trusted policy
        run: node scripts/verify-downloaded-hosting-artifact.mjs /tmp/pr226/dist
