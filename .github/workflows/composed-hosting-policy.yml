name: Composed Hosting Policy
on:
  pull_request:
    paths:
      - contracts/public-contact-policy*
      - scripts/hosting-artifact-verifier-lib.mjs
      - scripts/test-hosting-artifact-verifier.mjs
permissions:
  contents: read
jobs:
  composed-hosting-policy:
    name: composed-hosting-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {fetch-depth: 0}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - name: Build PR #226 artifact in isolated worktree
        run: |
          SOURCE_SHA="$(node -p "require('./contracts/public-contact-policy.json').composed_source.head_sha")"
          test "${#SOURCE_SHA}" = 40
          git fetch origin "$SOURCE_SHA"
          git worktree add --detach /tmp/pr226 "$SOURCE_SHA"
          cp contracts/public-contact-policy.json /tmp/pr226/contracts/public-contact-policy.json
          (cd /tmp/pr226 && npm ci && npm run build:hosting)
      - name: Verify composed 259-file artifact with current trusted policy
        run: |
          node scripts/verify-downloaded-hosting-artifact.mjs /tmp/pr226/dist
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),p=require('./contracts/public-contact-policy.json').composed_source;
          const b=fs.readFileSync('/tmp/pr226/dist/hosting-manifest.json'),m=JSON.parse(b);
          if(m.files.length!==p.expected_file_count)throw Error(`file count ${m.files.length}`);
          if(crypto.createHash('sha256').update(b).digest('hex')!==p.manifest_sha256)throw Error('manifest SHA mismatch');
          NODE
