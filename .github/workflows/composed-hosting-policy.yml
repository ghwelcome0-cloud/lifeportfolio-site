name: Composed Hosting Policy Bootstrap
on:
  pull_request:
    paths:
      - contracts/public-contact-policy.schema.json
      - contracts/public-contact-bootstrap.approval.json
      - scripts/hosting-artifact-verifier-lib.mjs
      - scripts/test-hosting-artifact-verifier.mjs
      - scripts/verify-public-contact-migration.mjs
      - scripts/verify-public-contact-bootstrap.mjs
      - .github/workflows/composed-hosting-policy.yml
permissions:
  contents: read
jobs:
  public-contact-bootstrap:
    name: public-contact-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "22", cache: npm}
      - run: npm ci
      - run: node scripts/verify-public-contact-bootstrap.mjs
      - run: node scripts/test-hosting-artifact-verifier.mjs
      - name: Assert policy remains inactive in bootstrap PR
        run: test ! -f contracts/public-contact-policy.json
