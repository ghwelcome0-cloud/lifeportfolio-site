# Read-only, manually dispatched branch variant. No deployment or customer data access.
name: Hosting Release Inventory (read-only)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inventory:
    name: Read public Hosting release metadata only
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Read live channel and last five releases
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          const sa=JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT||'{}');
          if(sa.type!=='service_account'||sa.project_id!=='lifeporfolio'||!sa.private_key||!sa.client_email)throw Error('Expected Firebase project identity unavailable');
          const encode=o=>Buffer.from(JSON.stringify(o)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const unsigned=encode({alg:'RS256',typ:'JWT'})+'.'+encode({iss:sa.client_email,scope:'https://www.googleapis.com/auth/firebase.readonly',aud:'https://oauth2.googleapis.com/token',iat:now,exp:now+300});
          const assertion=unsigned+'.'+crypto.sign('RSA-SHA256',Buffer.from(unsigned),sa.private_key).toString('base64url');
          const auth=await fetch('https://oauth2.googleapis.com/token',{method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:jwt-bearer',assertion})});
          if(!auth.ok)throw Error('Read-only authentication failed: HTTP '+auth.status);
          const token=(await auth.json()).access_token;
          if(!token)throw Error('No read-only access token');
          async function get(path){
            const r=await fetch('https://firebasehosting.googleapis.com/v1beta1/'+path,{method:'GET',redirect:'error',signal:AbortSignal.timeout(20000),headers:{Authorization:'Bearer '+token}});
            if(!r.ok)throw Error('Hosting metadata GET failed: '+path+' HTTP '+r.status);
            return r.json();
          }
          const channel=await get('sites/lifeporfolio/channels/live');
          const history=await get('sites/lifeporfolio/releases?pageSize=5');
          const clean=r=>({name:r?.name||null,type:r?.type||null,releaseTime:r?.releaseTime||null,version:{name:r?.version?.name||null,status:r?.version?.status||null,createTime:r?.version?.createTime||null,finalizeTime:r?.version?.finalizeTime||null}});
          if(!channel.release?.name||!channel.release?.version?.name)throw Error('Active channel has no verifiable release/version');
          const inventory={schema:1,project:'lifeporfolio',site:'lifeporfolio',observed_at:new Date().toISOString(),source:'Firebase Hosting live channel GET and release list GET',active_release:clean(channel.release),recent_releases:(history.releases||[]).map(clean),operations:'GET metadata only; no deployment, rollback, Functions, Auth or database operations',credential_values_exported:false};
          fs.writeFileSync('hosting-release-inventory.json',JSON.stringify(inventory,null,2)+'\n');
          console.log(JSON.stringify(inventory,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosting-release-inventory
          path: hosting-release-inventory.json
          if-no-files-found: error
          retention-days: 30
