name: Public Contact Bootstrap Evidence
on:
  workflow_dispatch:
    inputs:
      head_sha: {description: Exact approved PR 231 head, required: true, type: string}
permissions: {contents: read, pull-requests: read}
jobs:
  evidence:
    name: public-contact-bootstrap-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {ref: security/public-contact-verifier-bootstrap}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: "22"}
      - env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_PR_NUMBER: "231"
          BOOTSTRAP_HEAD_SHA: ${{ inputs.head_sha }}
        run: node scripts/verify-public-contact-bootstrap-evidence.mjs
