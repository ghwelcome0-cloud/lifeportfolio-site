name: Governance Bootstrap

on:
  pull_request:
    paths:
      - .github/CODEOWNERS
      - .github/workflows/**
      - docs/governance/**
      - scripts/test-contract-manifest.mjs
      - contracts/activation.json

permissions:
  contents: read

jobs:
  governance-bootstrap:
    name: governance-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate contract activation against base
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-contract-manifest.mjs
      - run: npm test
