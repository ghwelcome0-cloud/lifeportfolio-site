name: Governance Bootstrap

on:
  # [2026-08-11] paths 필터 제거.
  #   ★ 진원: 이 워크플로는 ruleset 'main-one-person-safe-mode' 의 required status check
  #     2건 중 하나다. 그런데 paths 필터 때문에 위 경로를 건드리지 않는 PR 에서는
  #     '실행 자체가 안 됨' = 영구 pending = 영구 merge 불가 상태가 됐다.
  #     (문서·카피·엔진·지면 수정 PR 전부 차단 — PR #230, #232 실증)
  #   ★ required check 은 모든 PR 에서 반드시 결론이 나야 한다. 필터를 걸 대상이 아니다.
  #     검사 자체가 가벼우므로(계약 매니페스트 검증) 전체 PR 에서 돌려도 비용 부담이 없다.
  pull_request:

permissions:
  contents: read

jobs:
  governance-bootstrap:
    name: governance-bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate contract activation against base
        env:
          CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CONTRACT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/test-contract-manifest.mjs
      - run: npm test
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
