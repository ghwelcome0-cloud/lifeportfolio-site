# ─────────────────────────────────────────────────────────────
#  Cloud Functions 수동 배포 (workflow_dispatch 전용)
#  ─ 배경 ─
#    Hosting 은 "Promote Firebase Hosting Live" 로 승격되지만 Cloud Functions 는
#    자동 배포 경로가 없어 functions/index.js 변경(예: #303 B2B 이메일 링크 정정)이
#    병합된 뒤에도 실제 함수는 옛 코드로 남았다. 대표 승인(2026-09-08):
#    "GitHub Actions에 Functions 배포 워크플로 추가를 승인" → 이 파일.
#  ─ 원칙 (배포헌법 v1.0 제1조: 확실하지 않으면 배포하지 않는다) ─
#    · main 브랜치에서만, 사람이 손으로만(workflow_dispatch) 실행한다.
#    · 대표 승인 GenTeam 메시지 ID 를 필수 입력으로 받아 로그에 남긴다.
#    · Hosting·Firestore·RTDB 규칙은 절대 건드리지 않는다(--only functions 고정).
#    · 배포 전 functions/index.js 가 실제로 로드되는지(문법·require) 확인한다.
#    · 서비스 계정은 production-live 환경 시크릿만 사용(저장소 시크릿 참조 금지 —
#      scripts/test-trusted-workflow-policy.mjs 규약).
#    · 배포 후 functions:list 로 결과를 출력한다(읽기 전용 검증).
# ─────────────────────────────────────────────────────────────
name: Deploy Firebase Functions (manual)

"on":
  workflow_dispatch:
    inputs:
      production_approval_message_id:
        description: "대표 승인 GenTeam 메시지 ID (필수 · 로그에 기록)"
        required: true
        type: string
      only:
        description: "배포 범위. 기본 'functions' (전체). 특정 함수만: functions:sendB2bInquiry 형식"
        required: false
        default: "functions"
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

jobs:
  deploy-functions:
    name: Cloud Functions 배포 (asia-northeast3 · lifeporfolio)
    runs-on: ubuntu-latest
    environment: production-live
    timeout-minutes: 30
    steps:
      - name: main 브랜치 전용 가드
        run: |
          test "${GITHUB_REF}" = "refs/heads/main" || { echo "::error::main 브랜치에서만 실행할 수 있습니다 (현재: ${GITHUB_REF})"; exit 1; }
          case "${{ inputs.only }}" in
            functions|functions:*) ;;
            *) echo "::error::only 입력은 'functions' 또는 'functions:<name>' 만 허용합니다"; exit 1 ;;
          esac
          echo "승인 메시지 ID: ${{ inputs.production_approval_message_id }}"
          echo "배포 범위    : ${{ inputs.only }}"
          echo "커밋         : ${GITHUB_SHA}"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22

      - name: 프로덕션 동결 상태 확인
        run: node scripts/verify-production-freeze.mjs

      - name: functions 의존성 설치 및 로드 검증
        working-directory: functions
        run: |
          npm ci --omit=dev
          node --check index.js
          # 실제 require 로 exports 개수를 확인한다(문법 통과 ≠ 로드 성공).
          node -e 'process.env.FUNCTIONS_EMULATOR="true";const m=require("./index.js");const n=Object.keys(m).length;if(n<1)throw new Error("exports 0");console.log("functions/index.js 로드 성공 · exports "+n+"개");'

      - name: 배포 신원 준비 (production-live 환경 시크릿만 · 저장소 시크릿 사용 금지)
        env:
          FIREBASE_PRODUCTION_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_PRODUCTION_SERVICE_ACCOUNT }}
        run: |
          # trusted-workflow-policy: 저장소 배포 시크릿은 Hosting 승격 2개 워크플로만 참조할 수 있다.
          # 이 워크플로는 production-live 환경 시크릿 하나만 쓴다(폴백 없음 — 없으면 배포하지 않는다).
          test -n "$FIREBASE_PRODUCTION_SERVICE_ACCOUNT" || { echo "::error::production-live 환경 시크릿 FIREBASE_PRODUCTION_SERVICE_ACCOUNT 가 없습니다"; exit 1; }
          printf '%s' "$FIREBASE_PRODUCTION_SERVICE_ACCOUNT" > "$RUNNER_TEMP/production-sa.json"
          node -e 'const c=require(process.argv[1]);if(c.type!=="service_account")throw new Error("not a service account credential");if(c.project_id!=="lifeporfolio")throw new Error("service account project mismatch: "+c.project_id);if(!c.client_email||!c.private_key)throw new Error("service account is missing client_email or private_key");console.log("service account project "+c.project_id+" client "+c.client_email);' "$RUNNER_TEMP/production-sa.json"

      - name: firebase-tools 설치
        run: npm install --no-save firebase-tools@13

      - name: 현재 라이브 함수의 문자열 파라미터를 읽어 functions/.env 생성 (값 변경 0)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/production-sa.json
        run: |
          # 비대화형 배포는 defineString 파라미터 값이 파일에 있어야 한다.
          # 사람이 값을 손으로 옮기면 틀릴 수 있으므로, 지금 라이브에 배포된 함수의
          # 환경변수를 그대로 읽어 .env 로 만든다(값 변경 0 = 코드만 바뀐다).
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/production-sa.json" --quiet
          gcloud config set project lifeporfolio --quiet
          KEYS="PAYPAL_ENV PAYPAL_PRICE_USD RESEND_FROM_EMAIL_KO RESEND_FROM_EMAIL_EN RESEND_REPLY_TO OPERATOR_NOTIFICATION_EMAIL D22_FORM_BASE_URL_KO D22_FORM_BASE_URL_EN D22_LOOKBACK_DAYS_MAX TEST_D22_ALLOWED_DOMAINS"
          # 문자열 파라미터를 전부 참조하는 함수 하나에서 읽는다(2세대 함수 = Cloud Run 서비스).
          SRC=""
          for f in createPaypalOrder paypalHealthCheck sendD22Email requestEscalation; do
            if gcloud functions describe "$f" --region=asia-northeast3 --gen2 --format=json > "$RUNNER_TEMP/fn.json" 2>/dev/null; then SRC="$f"; break; fi
          done
          test -n "$SRC" || { echo "::error::라이브 함수를 읽을 수 없습니다(describe 실패). functions/.env 를 만들 수 없어 배포를 중단합니다."; exit 1; }
          echo "env 원본 함수: $SRC"
          : > functions/.env
          MISSING=""
          for k in $KEYS; do
            v=$(node -e 'const j=require(process.argv[1]);const e=(j.serviceConfig&&j.serviceConfig.environmentVariables)||{};const v=e[process.argv[2]];if(v===undefined)process.exit(3);process.stdout.write(v);' "$RUNNER_TEMP/fn.json" "$k" 2>/dev/null) || { MISSING="$MISSING $k"; continue; }
            printf '%s=%s\n' "$k" "$v" >> functions/.env
          done
          echo "생성된 키: $(cut -d= -f1 functions/.env | tr '\n' ' ')"
          echo "라이브에 없던 키(코드 기본값 사용):$MISSING"
          # 안전 확인: PAYPAL_ENV 는 라이브 값 그대로여야 한다(기본값 sandbox 로 떨어지면 결제 사고).
          grep -q '^PAYPAL_ENV=' functions/.env || { echo "::error::라이브 함수에 PAYPAL_ENV 가 없어 값을 확정할 수 없습니다. 수동 확인 필요."; exit 1; }
          echo "PAYPAL_ENV=$(grep '^PAYPAL_ENV=' functions/.env | cut -d= -f2)"
          # 시크릿(defineSecret) 은 Secret Manager 에서 읽히므로 .env 에 넣지 않는다.

      - name: Cloud Functions 배포 (--only ${{ inputs.only }})
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/production-sa.json
        run: |
          node scripts/verify-production-freeze.mjs
          # hosting / firestore / database 는 이 워크플로에서 절대 배포하지 않는다.
          npx --no-install firebase deploy --only "${{ inputs.only }}" --project lifeporfolio --non-interactive --force

      - name: 배포 결과 확인 (읽기 전용)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/production-sa.json
        run: |
          npx --no-install firebase functions:list --project lifeporfolio --non-interactive | head -80

      - if: always()
        name: 자격 증명·생성 .env 파기
        run: rm -f "$RUNNER_TEMP/production-sa.json" functions/.env
